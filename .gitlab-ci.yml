stages:
  - install
  - lint
  - build
  - test

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm
    - node_modules

# Pipeline runs on push and merge requests
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH

install_dependencies:
  stage: install
  image: node:20
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules

lint:
  stage: lint
  image: node:20
  needs: [install_dependencies]
  script:
    - npm run lint
  allow_failure: false

build:
  stage: build
  image: node:20
  needs: [install_dependencies]
  script:
    - echo "Build step - add build command if needed"
  allow_failure: false

test_api:
  stage: test
  image: cypress/base:latest
  needs: [install_dependencies]
  script:
    - npx cypress install
    - node index.js &
    - npx wait-on http://127.0.0.1:8000
    - npx cypress run --spec cypress/api/api_spec.js,cypress/api/api_mock_spec.js
  artifacts:
    when: on_failure
    paths:
      - cypress/screenshots
      - cypress/videos
    expire_in: 7 days

test_ui:
  stage: test
  image: cypress/base:latest
  needs: [install_dependencies]
  script:
    - npx cypress install
    - node index.js &
    - npx wait-on http://127.0.0.1:8000
    - npx cypress run --spec cypress/e2e/health-check_spec.js,cypress/e2e/overview-page_spec.js
  artifacts:
    when: on_failure
    paths:
      - cypress/screenshots
      - cypress/videos
    expire_in: 7 days
